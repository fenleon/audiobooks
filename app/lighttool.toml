[tool]
id = "com.lightphone.audiobooks"
label = "Audiobooks"
versionCode = 20
versionName = "0.6.1"
permissions = []
capabilities = ["detached-audio"]
# The tool owns playback (SDK detached audio) and the UI; the companion (:server)
# hosts the SDK service, the /sdcard/Audiobooks scan, and the file provider.
# Point at com.lightos on a real LP3 once Light ships the media methods there.
serverPackage = "com.lightphone.audiobooks.server"
orientation = "portrait"
