[tool]
id = "com.lightphone.audiobooks"
label = "Audiobooks"
versionCode = 27
versionName = "0.8.0"
permissions = ["android.permission.READ_MEDIA_AUDIO", "android.permission.POST_NOTIFICATIONS"]
capabilities = ["detached-audio"]
# Tool Library line: binds Light's own platform service (com.lightos). The
# 0.8.0 fold merges the former :server companion into this scanned module —
# the /sdcard/Audiobooks scan, stores, and playback file access run
# in-process (no embedded LightSdkService, no separate companion APK).
serverPackage = "com.lightos"
orientation = "portrait"
